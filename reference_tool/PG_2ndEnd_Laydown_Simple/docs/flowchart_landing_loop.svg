<text x="407.5" y="136.9" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F2933">Load the previous step model; payout = next zone</text><text x="407.5" y="152.6" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F2933">target (first: WD - 100 m; then mudmat-wing zone,</text><text x="407.5" y="168.2" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F2933">30/20/10/5/0 m clearance targets, max payout</text><text x="407.5" y="183.8" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F2933">rate); +20 m if the last solve failed</text>
